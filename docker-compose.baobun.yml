# Merge this file into an existing stack with:
# docker compose -f docker-compose.yml -f docker-compose.baobun.yml up -d
services:
  baobun-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baobun
      POSTGRES_PASSWORD: ${BAOBUN_DB_PASSWORD:?Set BAOBUN_DB_PASSWORD}
      POSTGRES_DB: baobun
    volumes:
      - baobun-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baobun']
      interval: 5s
      timeout: 5s
      retries: 10

  baobun:
    image: ghcr.io/daniele-rolli/baobun:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://baobun:${BAOBUN_DB_PASSWORD}@baobun-db:5432/baobun
      PUBLIC_URL: ${BAOBUN_PUBLIC_URL:?Set BAOBUN_PUBLIC_URL}
      MAIL_DEBUG: ${BAOBUN_MAIL_DEBUG:-true}
      MAIL_SENDER: ${BAOBUN_MAIL_SENDER:-Baobun <no-reply@baobun.local>}
      MAIL_HOST: ${BAOBUN_MAIL_HOST:-}
      MAIL_PORT: ${BAOBUN_MAIL_PORT:-587}
      MAIL_SECURE: ${BAOBUN_MAIL_SECURE:-false}
      MAIL_USER: ${BAOBUN_MAIL_USER:-}
      MAIL_PASSWORD: ${BAOBUN_MAIL_PASSWORD:-}
    volumes:
      - baobun-app-data:/data
    depends_on:
      baobun-db:
        condition: service_healthy
    ports:
      - '${BAOBUN_LISTEN_ADDRESS:-127.0.0.1}:${BAOBUN_PORT:-4173}:4173'

volumes:
  baobun-db-data:
  baobun-app-data:
