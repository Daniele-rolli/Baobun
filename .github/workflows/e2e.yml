name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: e2e-postgres-password
      MINIO_ROOT_PASSWORD: e2e-minio-password
      MAIL_DEBUG: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: docker compose up -d --build
      - name: Wait for Baobun
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - run: yarn e2e
      - name: Print service logs after a failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
