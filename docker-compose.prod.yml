services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baobun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: baobun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baobun']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/daniele-rolli/baobun:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://baobun:${POSTGRES_PASSWORD}@postgres:5432/baobun
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      MAIL_DEBUG: ${MAIL_DEBUG:-true}
      MAIL_SENDER: ${MAIL_SENDER:-"Baobun <no-reply@baobun.local>"}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-4173}:4173'

volumes:
  pgdata:
  appdata:
